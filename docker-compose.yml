version: '3.9'

services:
  next-app:
    container_name: next-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      # 给浏览器用的（虽然改成了相对路径，保留也没事）
      - NEXT_PUBLIC_API_URL=/api

      # [关键] 给服务端 Node.js 用的内部地址
      # 注意：这里写的是你后端容器在 docker-compose 里的服务名！
      # 假设你的后端服务名叫 "backend_server"，端口是 3000
      - INTERNAL_API_URL=http://next-app:3000
    # Load environment variables from a .env file
    env_file:
      - .env
